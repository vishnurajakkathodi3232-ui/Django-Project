{% extends "base.html" %}

{% block content %}
<style>
    body {
        background: #f5f5f5;
    }
    .admin-nav {
        background: #4e342e;
        padding: 15px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0;
    }
    .admin-nav a {
        color: #ffe0b2;
        margin-left: 20px;
        text-decoration: none;
        font-weight: 600;
    }
    .admin-nav a.active, .admin-nav a:hover {
        color: #ffffff;
        text-decoration: underline;
    }
    h2 {
        text-align: center;
        color: #4e342e;
        margin-top: 30px;
    }
    .form-container {
        background: white;
        width: 60%;
        margin: 30px auto;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
        display: block;
        margin-top: 15px;
        color: #4e342e;
        font-weight: 600;
    }
    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 15px;
    }
    textarea {
        resize: vertical;
    }
    .submit-btn {
        background: #6d4c41;
        color: white;
        padding: 12px 20px;
        border: none;
        margin-top: 20px;
        width: 100%;
        font-weight: 600;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
    }
    .submit-btn:hover {
        background: #4e342e;
    }
</style>

<div class="admin-nav mb-0">
    <div><strong>Store Admin Panel</strong></div>
    <div>
        <a href="{% url 'storeadmin:admin_dashboard' %}">Dashboard</a>
        <a href="{% url 'storeadmin:admin_products' %}" class="active">Products</a>
        <a href="{% url 'storeadmin:admin_orders' %}">Orders</a>
        <a href="{% url 'storeadmin:admin_logout' %}">Logout</a>
    </div>
</div>

<h2>{% if edit %}Edit{% else %}Add New{% endif %} Product</h2>
<div class="form-container">
    <form method="POST">
        {% csrf_token %}
        <label>Product Name</label>
        <input type="text" name="name" required placeholder="Enter product name"
          value="{% if product %}{{ product.name }}{% endif %}">

        <label>Description</label>
        <textarea name="description" rows="4" required placeholder="Enter product description">{% if product %}{{ product.description }}{% endif %}</textarea>

        <label>Price (₹)</label>
        <input type="number" step="0.01" name="price" required placeholder="0.00"
          value="{% if product %}{{ product.price }}{% endif %}">

        <label>Stock</label>
        <input type="number" name="stock" required placeholder="Available stock"
          value="{% if product %}{{ product.stock }}{% endif %}">

        <label>Image URL</label>
        <input type="url" name="image_url" placeholder="Image URL"
          value="{% if product %}{{ product.image_url }}{% endif %}">

        <button type="submit" class="submit-btn">
            {% if edit %}Update{% else %}Add{% endif %} Product
        </button>
    </form>
</div>
{% endblock %}
