{% extends "base.html" %}

{% block content %}
<div class="container py-4">
  <h2 class="mb-4 fw-bold">Your Orders</h2>

  {% if orders %}
    <div class="table-responsive">
      <table class="table table-bordered mt-3 align-middle text-center">
        <thead class="table-dark">
          <tr>
            <th>Order ID</th>
            
            <th>Status</th>
            
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for order in orders %}
          <tr>
            <td>{{ order.id }}</td>
            
            <td>
              <span class="badge 
                {% if order.status == 'Pending' %}bg-warning
                {% elif order.status == 'Shipped' %}bg-primary
                {% elif order.status == 'Delivered' %}bg-success
                {% else %}bg-secondary{% endif %}">
                {{ order.status }}
              </span>
            </td>
            
            <td>
              <a href="{% url 'store:order_detail' order.id %}" class="btn btn-sm btn-info">
                View
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <p class="mt-3 alert alert-warning">You have no orders yet.</p>
  {% endif %}
</div>
{% endblock %}
