<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EntryKart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #fff5ee, #f7e3c3);
      color: #3e2723;
      min-height: 100vh;
      overflow-x: hidden;
    }

    html { scroll-behavior: smooth; }

    /* Navbar */
    .navbar {
      background: #6d4c41;
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(121, 85, 72, 0.2);
    }
    .navbar a {
      color: #fff3e0 !important;
      transition: color .3s;
    }
    .navbar a:hover {
      color: #ffcc80 !important;
    }
    .navbar-brand {
      color: #ffe0b2 !important;
      font-weight: 700;
    }

    /* Card styling */
    .glow-card {
      background: #fff;
      border: 1px solid #d7ccc8;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(121, 85, 72, 0.15);
      transition: transform .3s, box-shadow .3s;
    }
    .glow-card:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 18px rgba(121, 85, 72, 0.25);
    }

    /* Buttons */
    .btn-glow {
      background: linear-gradient(90deg, #a1887f, #ffcc80);
      border: none;
      color: #3e2723;
      font-weight: 600;
      transition: all .3s;
      box-shadow: 0 0 6px rgba(255, 183, 77, 0.3);
    }
    .btn-glow:hover {
      background: linear-gradient(90deg, #ffb74d, #ffe082);
      box-shadow: 0 0 10px rgba(255, 204, 128, 0.5);
      transform: translateY(-2px);
    }

    /* Titles */
    .glow-title {
      color: #4e342e;
      font-weight: 700;
      text-shadow: none;
    }

    /* Alerts */
    .alert {
      background: #fff3e0;
      border: 1px solid #ffcc80;
      color: #5d4037;
      font-weight: 500;
    }

    /* Soft background */
    .background-soft {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at 30% 20%, rgba(255, 224, 178, 0.25), transparent 60%),
                  radial-gradient(circle at 70% 80%, rgba(255, 224, 178, 0.2), transparent 60%);
      z-index: -1;
    }
  </style>
</head>

<body>
  <div class="background-soft"></div>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark px-3">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="{% url 'store:store-home' %}">EntryKart</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'store:store-home' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'store:products' %}">Products</a></li>

          {% if user.is_authenticated %}
            <li class="nav-item"><a class="nav-link" href="{% url 'store:dashboard' %}">Dashboard</a></li>

            <!-- 🔥 FIXED LOGOUT URL -->
            
            <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>

          {% else %}
            <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'store:register' %}">Register</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <!-- MESSAGES -->
  <div class="container py-4">
    {% if messages %}
      {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }} text-center mt-2">{{ msg }}</div>
      {% endfor %}
    {% endif %}
  </div>

  <!-- MAIN CONTENT -->
  <div class="container py-5">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
